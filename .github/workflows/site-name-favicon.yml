name: Fix Yeongildae site name and favicon
on:
  push:
    paths: ['.github/workflows/site-name-favicon.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update existing HTML without changing design
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          icon = Path('favicon.ico')
          if not icon.is_file() or icon.read_bytes()[:4] != b'\x00\x00\x01\x00':
              raise SystemExit('Existing favicon.ico missing or invalid. No changes made.')
          if not Path('index.html').is_file():
              raise SystemExit('index.html not found. No changes made.')

          for page in sorted(Path('.').glob('*.html')):
              if page.name.startswith('google'):
                  continue
              html = page.read_text(encoding='utf-8')
              head = re.search(r'<head\b[^>]*>', html, re.I)
              if not head:
                  continue
              extra = []
              if not re.search(r'\bproperty\s*=\s*["\']og:site_name["\']', html, re.I):
                  extra.append('<meta property="og:site_name" content="포항 영일대횟집">')
              if not re.search(r'\bname\s*=\s*["\']application-name["\']', html, re.I):
                  extra.append('<meta name="application-name" content="포항 영일대횟집">')
              if not re.search(r'\brel\s*=\s*["\'][^"\']*\bicon\b', html, re.I):
                  extra.append('<link rel="icon" href="/favicon.ico" type="image/x-icon">')
              if page.name == 'index.html':
                  if not re.search(r'\brel\s*=\s*["\']canonical["\']', html, re.I):
                      extra.append('<link rel="canonical" href="https://yeongildae.vercel.app/">')
                  if not re.search(r'"@type"\s*:\s*"WebSite"', html):
                      schema = {'@context':'https://schema.org', '@type':'WebSite',
                                'name':'포항 영일대횟집', 'alternateName':'영일대횟집',
                                'url':'https://yeongildae.vercel.app/'}
                      extra.append('<script type="application/ld+json">' +
                                   json.dumps(schema, ensure_ascii=False) + '</script>')
              if extra:
                  html = html[:head.end()] + '\n' + '\n'.join(extra) + '\n' + html[head.end():]
                  page.write_text(html, encoding='utf-8')
                  print('Updated:', page.name)
          PY
          git diff --check
          if ! git diff --quiet -- '*.html'; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- '*.html'
            git commit -m 'Fix Yeongildae site name and favicon metadata'
            git push
          else
            echo 'Already configured.'
          fi
